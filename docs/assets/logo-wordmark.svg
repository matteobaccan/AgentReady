<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 64" width="330" height="64"
     role="img" aria-label="AgentReady">
  <title>AgentReady</title>
  <desc>AgentReady wordmark: a five-step level meter beside the project name.</desc>

  <style>
    /* Honoured even when the SVG is loaded through &lt;img&gt;, as GitHub does. */
    .ink  { fill: #0F172A; }
    .mute { fill: #0F172A; opacity: .60; }
    @media (prefers-color-scheme: dark) {
      .ink  { fill: #E6EDF3; }
      .mute { fill: #E6EDF3; opacity: .62; }
    }
    .accent { fill: #10B981; }
  </style>

  <g class="accent">
    <rect x="6"  y="8"  width="42" height="7" rx="3.5" opacity="1"/>
    <rect x="6"  y="18" width="34" height="7" rx="3.5" opacity=".80"/>
    <rect x="6"  y="28" width="26" height="7" rx="3.5" opacity=".60"/>
    <rect x="6"  y="38" width="18" height="7" rx="3.5" opacity=".45"/>
    <rect x="6"  y="48" width="11" height="7" rx="3.5" opacity=".30"/>
    <circle cx="9.5" cy="60" r="2" opacity=".22"/>
  </g>

  <text x="66" y="34" class="ink"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="27" font-weight="700" letter-spacing="-0.6">Agent<tspan class="accent">Ready</tspan></text>

  <text x="67" y="52" class="mute"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="11.5" letter-spacing="0.3">Is this site ready for AI agents?</text>
</svg>
